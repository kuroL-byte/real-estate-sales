<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aalia Residences · Private Digital Twin | Architectural Cutaway</title>
    <meta
      name="description"
      content="A private architectural cutaway of Aalia Residences. Explore each level's RERA carpet area, Vastu conformance and clear ceiling heights, with a live solar study and structural X-ray."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              display: ['Cinzel', 'serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      /* Bronze hairline slider (Tailwind CDN cannot style vendor pseudo-elements) */
      .anatomy-range { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; outline: none; }
      .anatomy-range::-webkit-slider-runnable-track {
        height: 1px;
        background: linear-gradient(90deg, #C5A880 0%, #D4B895 var(--fill, 0%), rgba(241, 243, 245, .12) var(--fill, 0%));
      }
      .anatomy-range::-webkit-slider-thumb {
        -webkit-appearance: none; width: 3px; height: 18px; margin-top: -8.5px; border-radius: 1px;
        background: #F1F3F5;
        box-shadow: 0 0 0 3px rgba(197, 168, 128, .14), 0 0 14px rgba(212, 184, 149, .45);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .anatomy-range:hover::-webkit-slider-thumb { transform: scaleY(1.15); box-shadow: 0 0 0 4px rgba(197, 168, 128, .2), 0 0 18px rgba(212, 184, 149, .6); }
      .anatomy-range::-moz-range-track { height: 1px; background: rgba(241, 243, 245, .12); }
      .anatomy-range::-moz-range-progress { height: 1px; background: #C5A880; }
      .anatomy-range::-moz-range-thumb {
        width: 3px; height: 18px; border: 0; border-radius: 1px; background: #F1F3F5;
        box-shadow: 0 0 0 3px rgba(197, 168, 128, .14), 0 0 14px rgba(212, 184, 149, .45);
      }
      .anatomy-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(197, 168, 128, .35); }

      @keyframes conduitFlow { to { stroke-dashoffset: -18; } }
      .conduit-flow { animation: conduitFlow 1.4s linear infinite; }
      .xray-off .conduit-flow { animation-play-state: paused; }
      @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .panel-enter { animation: panelIn .6s cubic-bezier(.2, .8, .2, 1) both; }
      @keyframes sunPulse { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
      .sun-pulse { animation: sunPulse 4s ease-in-out infinite; }
      .tier-g:focus { outline: none; }
      .thin-scroll::-webkit-scrollbar { width: 4px; }
      .thin-scroll::-webkit-scrollbar-thumb { background: rgba(197, 168, 128, .18); }
      .grain {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>");
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 m-0 p-0 overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
